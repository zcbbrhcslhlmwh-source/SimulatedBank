<!DOCTYPE html>
<html>
<head>
    <title>Customer Welcome</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }

        h1 {
            color: #1f2d3d;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            background: #2d8cf0;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
        }

        a:hover {
            background: #1a73d9;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>欢迎来到我们的银行</h1>
        <p>电子银行版本</p>

        <a href="/customer0">请登录电子银行</a>
    </div>

</body>
</html>
